<div class="campo{% if campo.errors %} campo--erro{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} <span class="obrigatorio" aria-hidden="true">*</span>{% endif %}</label>
  {{ campo }}
  {% if campo.help_text %}<small class="helptext">{{ campo.help_text }}</small>{% endif %}
  {{ campo.errors }}
</div>
